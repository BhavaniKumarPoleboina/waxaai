<div class="container">

  <h1>Available Jobs</h1>

  <div class="job-grid">

    <div
      class="job-card"
      *ngFor="let job of jobs">

      <h2>{{ job.title }}</h2>

      <p>
        📍 {{ job.location }}
      </p>

      <p>
        Experience:
        {{ job.experienceRequired }} years
      </p>

      <p>
        Salary:
        ₹{{ job.salary }}
      </p>

      <p>
        Type:
        {{ job.jobType }}
      </p>

    </div>

  </div>

</div>
